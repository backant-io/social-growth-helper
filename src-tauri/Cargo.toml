[package]
name = "social-growth-helper"
version = "0.1.0"
description = "Local-first desktop copilot for growing an X account without API-bot footprints"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[lib]
name = "social_growth_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
async-trait = "0.1"
base64 = "0.22"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = { version = "0.4", features = ["std"] }
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
keyring = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
